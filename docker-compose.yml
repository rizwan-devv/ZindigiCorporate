services:
  zindigi-corporate-backend:
    build: ./backend
    image: zindigi-corporate-backend:latest
    container_name: zindigi-corporate-backend
    restart: unless-stopped
    ports:
      - "8150:8090"
    environment:
      # --- Same MySQL as DFS Corporate (dfs_corporate) ---
      MYSQL_HOST: 172.17.0.1
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: dfs_corporate
      MYSQL_USER: dfs
      MYSQL_PASSWORD: change-me
      JWT_SECRET: zindigi-corporate-change-this-to-a-long-random-secret
      APP_BRAND_NAME: Zindigi Corporate
      FRONTEND_BASE_URL: http://46.224.146.158:8160
      MOBILE_APP_BASE_URL: zindigicorp://kyc
      MAIL_ENABLED: "true"
      MAIL_HOST: smtp.gmail.com
      MAIL_PORT: "587"
      MAIL_USER: ryaqoob356@gmail.com
      MAIL_PASS: "1Xctrl22"
      MAIL_FROM: ryaqoob356@gmail.com
      MAIL_SMTP_AUTH: "true"
      MAIL_SMTP_STARTTLS: "true"
      DFS_ACCOUNT_API_ENABLED: "true"
      DFS_ACCOUNT_API_BASE_URL: http://46.225.160.93:18001
      # AgentApp corporate portal (balance / mini-statement / change MPIN / live transfers).
      # BOTH must be set, then recreate backend: DFS_PORTAL_API_ENABLED=true AND a real CORPORATE_PORTAL_API_KEY.
      DFS_PORTAL_API_ENABLED: "false"
      CORPORATE_PORTAL_API_KEY: ""
      DFS_TXN_API_BASE_URL: http://46.225.160.93:18009/transactions
      DFS_APP_API_BASE_URL: http://46.225.160.93:18002/app
      DFS_PORTAL_API_CHANNEL: COP
      # CMS card APIs — recreate backend after changing these
      DFS_CMS_API_ENABLED: "false"
      DFS_CMS_PORTAL_BASE_URL: http://46.224.146.158:7070
      DFS_CMS_APP_BASE_URL: http://46.224.146.158:8016
      DFS_CMS_PORTAL_LOGIN_ID: ""
      DFS_CMS_PORTAL_PASSWORD: ""
      DFS_CMS_APP_USERNAME: ""
      DFS_CMS_APP_PASSWORD: ""
      DFS_CMS_APP_API_KEY: ""
      APP_CORS_ORIGINS: http://46.224.146.158:8160,http://localhost:5173,http://localhost:5174
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - zindigi_uploads:/app/uploads

  zindigi-corporate-frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://46.224.146.158:8150
    image: zindigi-corporate-frontend:latest
    container_name: zindigi-corporate-frontend
    restart: unless-stopped
    ports:
      - "8160:80"
    depends_on:
      - zindigi-corporate-backend

volumes:
  zindigi_uploads:
